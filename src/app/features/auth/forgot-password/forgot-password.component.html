<app-auth-layout heading="Forgot Password" subtitle="Enter your email and we will send you a reset link.">
  @if (sent()) {
    <div class="alert alert-success d-flex gap-2">
      <i class="bi bi-envelope-check"></i>
      <span>If this email has an account, a reset link is on its way. Check your inbox.</span>
    </div>
    <a routerLink="/login" class="btn btn-outline w-100">Back to login</a>
  } @else {
    @if (error()) { <div class="alert alert-danger py-2">{{ error() }}</div> }
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-4">
        <label class="form-label" for="email">Email</label>
        <input id="email" type="email" class="form-control" formControlName="email" placeholder="you@example.com" autocomplete="email">
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <div class="field-error">Please enter a valid email address.</div>
        }
      </div>
      <button type="submit" class="btn btn-primary w-100 mb-3" [disabled]="saving()">
        @if (saving()) { <span class="spinner-border spinner-border-sm"></span> }
        Send reset link
      </button>
      <p class="text-center mb-0"><a routerLink="/login">Back to login</a></p>
    </form>
  }
</app-auth-layout>
